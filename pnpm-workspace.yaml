catalogMode: prefer
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 262800

trustPolicyExclude:
  - tinyexec@1.2.2

shellEmulator: true

packages:
  - packages/*
  - packages-aliased/*
  - integrations/*
  - test/fixtures/nuxt-cloudflare-module
  - '!examples/vue-2'
  - examples/*
  - docs

overrides:
  '@arethetypeswrong/core>fflate': 0.8.3
  # Keep Vite on one peer variant so plugin types share the same module identity.
  '@types/node': 26.5.1
  '@vitejs/devtools': 0.4.12
  chokidar: 5.0.0
  esbuild: 'catalog:'
  oxc-walker>@oxc-project/types: 0.149.0
  # Keep Rolldown on one peer variant so unplugin resolves a single
  # UnpluginInstance type across the workspace.
  rolldown: 'catalog:'
  rollup: 'catalog:'
  unhead@3.1.8: workspace:*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  vue-demi: true

ignoredBuiltDependencies:
  - lmdb
  - msgpackr-extract

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver

